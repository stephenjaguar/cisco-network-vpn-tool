# Conceptual FortiGate IPSec VPN configuration example
# Values align with VPN_PLAN.md and are intended for planning/review, not blind production paste.

config firewall address
    edit "FGT_LAN_10.10.10.0_24"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "PA_LAN_10.20.20.0_24"
        set subnet 10.20.20.0 255.255.255.0
    next
end

config vpn ipsec phase1-interface
    edit "vpn-pa-dc"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 20
        set remote-gw 203.0.113.20
        set psksecret "STORE_IN_SECRET_MANAGER"
    next
end

config vpn ipsec phase2-interface
    edit "vpn-pa-dc-p2"
        set phase1name "vpn-pa-dc"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 14
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet 10.20.20.0 255.255.255.0
    next
end

config system interface
    edit "vpn-pa-dc"
        set ip 169.255.1.1 255.255.255.252
        set allowaccess ping
        set type tunnel
        set remote-ip 169.255.1.2 255.255.255.252
    next
end

config router static
    edit 0
        set dst 10.20.20.0 255.255.255.0
        set device "vpn-pa-dc"
    next
end

config firewall policy
    edit 0
        set name "FGT-to-PA-VPN"
        set srcintf "lan"
        set dstintf "vpn-pa-dc"
        set srcaddr "FGT_LAN_10.10.10.0_24"
        set dstaddr "PA_LAN_10.20.20.0_24"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
